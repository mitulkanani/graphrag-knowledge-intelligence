[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-knowledge-intelligence"
version = "0.1.0"
description = "Graph-enhanced retrieval with entity relationships, community context, and cited answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThinkNovus Technologies" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.60,<3.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
